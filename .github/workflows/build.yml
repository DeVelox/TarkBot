name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # Allow creating releases
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'  # Stable version for PyInstaller

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: uv sync

    - name: Install PyInstaller
      run: uv add pyinstaller

    - name: Build executable
      run: |
        uv run pyinstaller --onefile --console --name TarkBot main.py

    - name: Create release zip
      run: |
        move dist\TarkBot.exe TarkBot.exe
        7z a TarkBot-Windows.zip TarkBot.exe .env-example config.toml

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: TarkBot-Windows.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TarkBot-Windows
        path: TarkBot-Windows.zip
        retention-days: 30